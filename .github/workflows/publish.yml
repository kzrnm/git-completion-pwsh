name: Test & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force-publish:
        description: Force publish even if tests fail
        required: false
        type: boolean
        default: false
env:
  Module: git-completion
jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      is-prerelease: ${{ steps.get-version.outputs.is-prerelease }}
      new-tag: ${{ steps.is-new-version.outputs.new-tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Update git command
        uses: ./.github/actions/latest-git
        continue-on-error: true
      - name: Get Module Version
        id: get-version
        shell: pwsh
        run: |
          Import-Module "./src/${env:Module}.psd1"
          $m = (Get-Module $env:Module)
          $version = $m.Version.ToString()
          $prerelease = $m.PrivateData.PSData.Prerelease
          if ($prerelease) {
            Write-Output "is-prerelease=true" | Tee-Object "$env:GITHUB_OUTPUT" -Append
            $prerelease = "-$prerelease"
          } else {
            Write-Output "is-prerelease=false" | Tee-Object "$env:GITHUB_OUTPUT" -Append
          }
          Write-Output "version=$version$prerelease" | Tee-Object "$env:GITHUB_OUTPUT" -Append

      - name: Check tag
        uses: mukunku/tag-exists-action@v1.7.0
        id: check-tag
        with:
          tag: v${{ steps.get-version.outputs.version }}

      - name: is new version?
        id: is-new-version
        run: |
          TAG=""
          if [ "${{ steps.check-tag.outputs.exists }}" = "false" ]; then
            echo "new version tag project: ${{ steps.get-version.outputs.version }}"
            TAG="v${{ steps.get-version.outputs.version }}"
          fi
          echo "new-tag=$TAG" | tee -a "$GITHUB_OUTPUT"
  test:
    uses: ./.github/workflows/test.yml
    with:
      continue-on-error: ${{ inputs.force-publish || false }}

  new-version-only:
    runs-on: ubuntu-latest
    needs: [get-version, test]
    if: ${{ needs.get-version.outputs.new-tag != '' && (inputs.force-publish || ! failure()) }}
    steps:
      - run: echo "new-version"

  publish:
    runs-on: ubuntu-latest
    environment:
      name: actions
      url: https://github.com
    needs: [get-version, new-version-only]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 
      - name: Install-Module PowerShellGet
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PowerShellGet -MinimumVersion " 3.0.23-beta23" -AllowPrerelease -Repository PSGallery -AllowClobber -Force

      - name: Merge scripts
        shell: pwsh
        run: tools/dist.ps1 -TagName "v${{ needs.get-version.outputs.version }}"

      - name: Test packed module
        shell: pwsh
        run: |
          $result = Invoke-Pester -PassThru -ErrorAction SilentlyContinue
          $failedRatio = ($result.FailedCount / $result.TotalCount)
          if ($failedRatio -gt 0.01) {
            throw "Failure: $($failedRatio*100) %"
          } elseif ($failedRatio -gt 0) {
            echo "::warning title=A few tests failed::Less than 1% of the tests are failing. This is most likely due to changes in the Git commands."
          }
          $packedModule = (Get-Item git-completion/git-completion.psm1).FullName
          $usedModule = (Get-Module git-completion).Path
          if ($packedModule -ne $usedModule) {
            throw "The test target is not packed module. Packed: $packedModule, used: $usedModule"
          }
          if(Complete-Git -Words @("git","clone","--b") | Where-Object CompletionText -EQ '--bare') {
            echo 'Success!'
          } else {
            throw 'Failed to dist.ps1'
          }
        env:
          TestPackedModule: 1

      - name: Create release
        uses: ncipollo/release-action@v1
        id: create-release
        with:
          commit: ${{ github.sha }}
          tag: ${{ needs.get-version.outputs.new-tag }}
          name: Version ${{ needs.get-version.outputs.version }}
          body: ${{ github.server_url }}/${{ github.repository }}/blob/${{ needs.get-version.outputs.new-tag }}/CHANGELOG.md
          prerelease: ${{ needs.get-version.outputs.is-prerelease }}
          generateReleaseNotes: true
      - name: Publish
        shell: pwsh
        run: |
          $NUGET_KEY = "${{ secrets.PWSH_NUGET_KEY  }}"
          Import-Module PowerShellGet
          Publish-PSResource -Path "./$env:Module" -APIKey "$NUGET_KEY" -Repository PSGallery
